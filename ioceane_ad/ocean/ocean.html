{ // choose ocean particles closest to the centre zone so the lift reads as "rising from the water"

const shapeVideo = fillShape((i) => {

// ---------- material ----------
const geo = new THREE.BufferGeometry();

geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  uniforms: { uScale: { value: 1 } },

// the falling drop (bright core + halo) and its trail
const dropGeo = new THREE.BufferGeometry(); const DT = 40;

// ---------- ripples ----------
const ripples = [{ x: 0, z: 0, t0: T.impact, amp: 1.0, speed: 4.2 }];

// ---------- camera path ----------
const CAM = [ // t, pos, target
  [0.0, [0, 1.6, 13], [0, 3.0, 0]],
  [T.impact, [0, 1.5, 11], [0, .6, 0]],
  [T.idea + .6, [0, 3.6, 15], [0, 0, -2]],
  [T.wave + .3, [0, 2.0, 12], [0, 1.4, -6]],
  [T.shapes[0] - .2, [0, 2.6, 10.5], [0, 2.3, 0]],
  [T.shapesEnd, [0, 2.6, 10.5], [0, 2.3, 0]],

        pz = lerp(z, tz, we) + Math.sin(li * .9 + t * 1.3) * swirl * .6;
        br = lerp(br, lw > 0 ? .3 + .25 * (1 - lw) : .62, we); sz = lerp(sz, lw > 0 ? 4.2 : 5.5, we);
        if (lw > 0) { const lc = new THREE.Color(logoCol[li*3], logoCol[li*3+1], logoCol[li*3+2]); tmp.lerp(lc, we * lw); }
        else tmp.lerp(tmp.clone().copy(BLUE).lerp(MINT, (sy + 2) / 4), we);
      }
    }
    pos[k*3] = px; pos[k*3+1] = py; pos[k*3+2] = pz;
    col[k*3] = tmp.r; col[k*3+1] = tmp.g; col[k*3+2] = tmp.b;
    size[k] = sz; alpha[k] = br;
  }
  // logo particle dissolve: fade particles as crisp logo appears
  const lfade = 1 - sm(T.logo + 1.3, T.logo + 2.3, t) * .92;
  if (lw > 0) for (const k of lifters) alpha[k] *= lfade;
  // dust
  for (let i = 0; i < NDUST; i++) {
    const k = NO + i; const rise = (t * .15 + i * .013) % 1;
    pos[k*3] = dust[i*3] + Math.sin(t * .3 + i) * .3; pos[k*3+1] = dust[i*3+1] + rise * 2; pos[k*3+2] = dust[i*3+2];
    tmp.copy(BLUE).lerp(MINT, (i % 7) / 7); col[k*3] = tmp.r; col[k*3+1] = tmp.g; col[k*3+2] = tmp.b;
    size[k] = 14; alpha[k] = .25 * Math.sin(rise * Math.PI) * (.4 + .6 * life);
  }
  geo.attributes.position.needsUpdate = geo.attributes.color.needsUpdate = geo.attributes.size.needsUpdate = geo.attributes.alpha.needsUpdate = true;

  // drop + trail
  const df = clamp((t - T.dropStart) / (T.impact - T.dropStart));

  for (let i = 0; i < DT; i++) {
    const lag = i * .006; const f2 = clamp((t - lag - T.dropStart) / (T.impact - T.dropStart)); const yy = 6.8 * (1 - f2 * f2);
    dPos[i*3] = 0; dPos[i*3+1] = yy; dPos[i*3+2] = 0;
    const on = t >= T.dropStart && t < T.impact ? 1 : 0;
    dCol[i*3] = i ? .5 : 1; dCol[i*3+1] = i ? .85 : 1; dCol[i*3+2] = 1;
    dSize[i] = i ? 22 * (1 - i / DT) : 60; dA[i] = on * (i ? .5 * (1 - i / DT) : 1) * sm(T.dropStart, T.dropStart + .4, t);
  }
  dropGeo.attributes.position.needsUpdate = dropGeo.attributes.size.needsUpdate = dropGeo.attributes.alpha.needsUpdate = dropGeo.attributes.color.needsUpdate = true;

  camera.position.set(...p); camera.lookAt(...g);
  // impact flash via bloom strength
  const flash = Math.exp(-Math.max(0, t - T.impact) * 4) * (t > T.impact ? 1 : 0);
  bloom.strength = .95 + flash * 1.8;

  composer.render();
  overlays(t);
}

function show(el, a, b, fi = .4, fo = .35, dy = 24) {
  const o = Math.min(ease((window.__t - a) / fi), 1 - ease((window.__t - (b - fo)) / fo));
  el.style.opacity = clamp(o); el.style.transform = `translateY(${dy * (1 - ease((window.__t - a) / (fi + .2)))}px)`;
}
function overlays(t) {
  window.__t = t;
  for (let s = 0; s < 4; s++) show($('w' + s), T.shapes[s] + .15, s < 3 ? T.shapes[s + 1] - .05 : T.shapesEnd, .35, .25);
  show($('stats'), T.stats + .2, T.oceanLine - .15, .5, .35);
  $('n1').textContent = Math.round(16 * easeIO((t - T.stats - .2) / .9));
  $('n2').textContent = Math.round(150 * easeIO((t - T.n2) / 1.2));
  show($('ocean'), T.oceanLine, T.logo - .1, .5, .4);
  const lo = sm(T.logo + 1.0, T.logo + 2.0, t);
  $('logo').style.opacity = lo; $('logo').style.transform = `scale(${.96 + .04 * lo})`;
  show($('tag'), T.tag + .3, 99, .5, .1); show($('cta'), T.cta, 99, .45, .1, 0); show($('contact'), T.contact, 99, .5, .1, 14);
  const pulse = t > T.cta + .6 ? 1 + .025 * Math.sin((t - T.cta) * 4) : 1; $('cta').style.transform = `scale(${pulse})`;
  $('fade').style.opacity = Math.max(1 - sm(0, .8, t), sm(T.END - .7, T.END, t));
  // keep the logo particle formation in the same place as the crisp logo
}

window.setup = async (mode) => {
  PORT = mode === 'port'; document.body.className = mode;
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.fov = PORT ? 62 : 40; camera.updateProjectionMatrix();
  mat.uniforms.uScale.value = 10 * (H / (2 * Math.tan(camera.fov * Math.PI / 360))) / 1483.6;
  composer = new EffectComposer(renderer); composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(W, H), .95, .5, .22); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  await buildLogo();
  await document.fonts.ready;
  LRECT = $('logo').getBoundingClientRect();
  window.READY = true;
};
window.render = render;
</script>
</body>
